openapi: '3.0.2'
info:
  title: GController controls
  version: '1.1'
servers:
  - url: http://192.168.10.106:8000
  - url: http://localhost:8000
paths:
  /control:
    get:
      summary: Return all control value
      operationId: returnControls
      tags:
        - control
      responses:
        200:
          description: The current state of the stored values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlData'
        400:
          description: Invalid imput.
        500:
          description: Internal server error.

    post:
      summary: Add control values
      operationId: addControls
      tags:
        - control
      description: This operation allows for sending control data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlData'
      responses:
        204:
          description: The sent control was succesfuly processed.
        400:
          description: Invalid imput.
        500:
          description: Internal server error.
components:
  schemas:
    ControlData:
      title: ControlData
      type: object
      description: The control data containing the necessary control informations and data
      properties:
        timestamp:
          type: string
          format: date-time
          description: The time the control was sent in UTC (zulu) time
          example: '2021-10-20T19:32:28.345Z'
        switch:
          type: boolean
          description: Shows if the switch control is turned on or off.
        slider:
          type: integer
          format: int32
          description: The number set by the slider control.
          example: 24
        rotaryknob:
          type: number
          format: float
          description: The number set by the rotary knob control.
          example: 62
        select:
          type: array
          minItems: 4
          maxItems: 4
          items: 
            type: boolean
          description: An array where the selected items are ture and the non selected ones are false.
  securitySchemes:
    g-security:
      openIdConnectUrl: "http://192.168.10.106:8080/auth/realms/grealm/.well-known/openid-configuration"
      type: openIdConnect
      description: Security
security:
    - 
        g-security: []





