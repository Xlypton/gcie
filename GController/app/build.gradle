plugins {
	id 'com.android.application'
	id 'kotlin-android'
}

android {
	compileSdk 30

	defaultConfig {
		applicationId "hu.xlipton.gcontroller"
		minSdk 26
		targetSdk 30
		versionCode 1
		versionName "1.0"

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		vectorDrawables {
			useSupportLibrary true
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	kotlinOptions {
		jvmTarget = '1.8'
		useIR = true
	}
	buildFeatures {
		compose true
	}
	composeOptions {
		kotlinCompilerExtensionVersion compose_version
		kotlinCompilerVersion '1.5.21'
	}
	packagingOptions {
		resources {
			excludes += '/META-INF/{AL2.0,LGPL2.1}'
		}
	}
}

dependencies {

	implementation 'androidx.core:core-ktx:1.6.0'
	implementation 'androidx.appcompat:appcompat:1.3.1'
	implementation 'com.google.android.material:material:1.4.0'
	implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
	implementation 'androidx.activity:activity-compose:1.3.0-alpha06'
	testImplementation 'junit:junit:4.+'
	androidTestImplementation 'androidx.test.ext:junit:1.1.3'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

	// Compose
	implementation "androidx.compose.ui:ui:$compose_version"
	implementation "androidx.compose.material:material:$compose_version"
	implementation "androidx.compose.foundation:foundation:$compose_version"
	implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
	implementation 'androidx.activity:activity-compose:1.3.0-alpha06'
	// Integration with observables
	implementation "androidx.compose.runtime:runtime-livedata:$compose_version"
	implementation "androidx.compose.runtime:runtime-rxjava2:$compose_version"
	// UI Tests
	androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
	debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"

	// MediaPipe solution-core is the foundation of any MediaPipe solutions.
	implementation 'com.google.mediapipe:solution-core:latest.release'
	// Optional: MediaPipe Hands solution.
	implementation 'com.google.mediapipe:hands:latest.release'
	// MediaPipe deps
	implementation 'com.google.flogger:flogger:0.7.1'
	implementation 'com.google.flogger:flogger-system-backend:0.7.1'
	implementation 'com.google.guava:guava:27.0.1-android'
	implementation 'com.google.protobuf:protobuf-java:3.11.4'
	// CameraX core library using the camera2 implementation
	def camerax_version = "1.0.1"
	implementation "androidx.camera:camera-core:$camerax_version"
	implementation "androidx.camera:camera-camera2:$camerax_version"
	implementation "androidx.camera:camera-lifecycle:$camerax_version"
}