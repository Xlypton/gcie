// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
	ext {
		compose_version = '1.0.1'
	}
	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:7.0.2'
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.21"
		classpath "org.openapitools:openapi-generator-gradle-plugin:5.3.0"
		//classpath "com.yelp.codegen:plugin:<latest_version>"
		// NOTE: Do not place your application dependencies here; they belong
		// in the individual module build.gradle files
	}
}

task clean(type: Delete) {
	delete rootProject.buildDir
}

apply plugin: 'org.openapi.generator'


openApiGenerate {
	generatorName = "kotlin"
	inputSpec = "../API/openapi:control.yml".toString()
	outputDir = "$buildDir/generated".toString()
	apiPackage = "hu.xlipton.control.api"
	packageName = "hu.xlipton.control"
	invokerPackage = "hu.xlipton.control.invoker"
	modelPackage = "hu.xlipton.control.model"
	configOptions = [
			dateLibrary: "java8",
			library: "jvm-retrofit2",
			useCoroutines: "true",
			serializationLibrary: "gson"
	]
	copy {
		from("$buildDir/generated/src/main/kotlin/hu/xlipton/") {
			include "control/**"
		}
		into "$rootDir/app/src/main/java/hu/xlipton/gcontroller/api/"
	}
}